<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AGC Kids</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden; background-color: #000; /* Match your app theme */
    }
    iframe {
      border: none; width: 100%; height: 100%;
      /* Handle iOS notch/safe area padding here if needed */
      padding-top: env(safe-area-inset-top);
    }
  </style>
</head>
<body>
  <div id="app-container" style="height: 100vh;"></div>

  <script>
    const container = document.getElementById('app-container');

    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
      const iframe = document.createElement('iframe');
      iframe.src = "https://script.google.com/a/macros/agcthailand.org/s/AKfycbwhgWmR_EDXiKvxYysYZgdEPy2pYI4DU6xXrbW6zCaYd2MCERrlM2sy1i04S5RfxSo4/exec";
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      container.appendChild(iframe);
      function saveToUrl(key, value) {
        const currentHash = window.location.hash.substring(1);
        const params = new URLSearchParams(currentHash);
        params.set(key, value);
        window.location.hash = params.toString();
      }
    } else {
      container.innerHTML = `
        <div style="color:white; text-align:center; padding:50px; font-family:sans-serif;">
          <h1>Install AGC Kids</h1>
          <p>Tap <strong>Share</strong> then <strong>Add to Home Screen</strong></p>
        </div>`;
    }
  </script>
</body>
</html>
